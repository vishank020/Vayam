version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: community-db
    restart: always
    environment:
      POSTGRES_DB: community_db
      POSTGRES_USER: community_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community_user -d community_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio:
    image: quay.io/minio/minio:latest
    container_name: community-storage
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  backend:
    build:
      context: ./backend
    container_name: community-api
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/community_db
      DB_USERNAME: community_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?ENCRYPTION_SECRET required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      MINIO_BUCKET: community
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      CORS_ALLOWED_ORIGIN: ${DOMAIN:-https://localhost}
      COOKIE_SECURE: "true"
      MAIL_HOST: ${MAIL_HOST:-smtp.sendgrid.net}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-apikey}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-byme2519@gmail.com}
      APP_URL: ${DOMAIN:-https://localhost}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
    container_name: community-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
