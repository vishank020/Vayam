server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/community_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    access-token-expiration: 900000     # 15 minutes in ms
    refresh-token-expiration: 604800000 # 7 days in ms
    secret: ${JWT_SECRET}
  encryption:
    secret: ${ENCRYPTION_SECRET}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:community}
    region: ${MINIO_REGION:us-east-1}
  cookies:
    secure: ${COOKIE_SECURE:false}
  url: ${APP_URL:http://localhost:4200}
  mail:
    verification-token-expiry-hours: 24
    password-reset-token-expiry-hours: 1

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

giphy:
  api:
    key: ${GIPHY_API_KEY:}

brevo:
  api-key: ${BREVO_API_KEY}
  from-email: ${BREVO_FROM_EMAIL}
